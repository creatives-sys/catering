<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test White Text on Selected Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f1ead8;
      font-family: 'Jost', sans-serif;
      padding: 40px;
    }
    .size-pill-row {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
      max-width: 550px;
    }
    .size-pill-btn {
      flex: 1;
      padding: 16px 20px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
      background: #d8ded6;
      border: 1px solid rgba(58, 71, 54, 0.22);
    }
    .size-pill-name {
      font-size: 17px;
      font-weight: 600;
      color: #3a4736;
      margin-bottom: 4px;
    }
    .size-pill-serves {
      font-size: 12px;
      color: #5d7059;
      margin-bottom: 6px;
    }
    .size-pill-price {
      font-size: 15px;
      font-weight: 700;
      color: #3a4736;
    }

    /* Option 1: #a7b2a3 with pure white text */
    .card-sage.active {
      background: #a7b2a3 !important;
      border: 2px solid #3a4736 !important;
      box-shadow: 0 4px 16px rgba(58, 71, 54, 0.22) !important;
    }
    .card-sage.active .size-pill-name,
    .card-sage.active .size-pill-serves,
    .card-sage.active .size-pill-price {
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    /* Option 2: #52674e (rich primary green) with white text */
    .card-rich.active {
      background: #52674e !important;
      border: 2px solid #3a4736 !important;
      box-shadow: 0 4px 16px rgba(58, 71, 54, 0.25) !important;
    }
    .card-rich.active .size-pill-name,
    .card-rich.active .size-pill-serves,
    .card-rich.active .size-pill-price {
      color: #ffffff !important;
    }

    /* Option 3: #3a4736 (deep primary green) with white text */
    .card-dark.active {
      background: #3a4736 !important;
      border: 2px solid #273324 !important;
      box-shadow: 0 4px 18px rgba(58, 71, 54, 0.28) !important;
    }
    .card-dark.active .size-pill-name,
    .card-dark.active .size-pill-serves,
    .card-dark.active .size-pill-price {
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <h3>1. Background #a7b2a3 (--fh-primary) with White Text</h3>
  <div class="size-pill-row">
    <div class="size-pill-btn active card-sage">
      <div class="size-pill-name">6" Petite</div>
      <div class="size-pill-serves">Serves 7–8</div>
      <div class="size-pill-price">$109.00</div>
    </div>
    <div class="size-pill-btn">
      <div class="size-pill-name">9" Grand</div>
      <div class="size-pill-serves">Serves 12–14</div>
      <div class="size-pill-price">$159.00</div>
    </div>
    <div class="size-pill-btn">
      <div class="size-pill-name">12" Banquet</div>
      <div class="size-pill-serves">Serves 20–22</div>
      <div class="size-pill-price">$209.00</div>
    </div>
  </div>

  <h3>2. Background #3a4736 (--fh-primary-dark) with White Text</h3>
  <div class="size-pill-row">
    <div class="size-pill-btn active card-dark">
      <div class="size-pill-name">6" Petite</div>
      <div class="size-pill-serves">Serves 7–8</div>
      <div class="size-pill-price">$109.00</div>
    </div>
    <div class="size-pill-btn">
      <div class="size-pill-name">9" Grand</div>
      <div class="size-pill-serves">Serves 12–14</div>
      <div class="size-pill-price">$159.00</div>
    </div>
    <div class="size-pill-btn">
      <div class="size-pill-name">12" Banquet</div>
      <div class="size-pill-serves">Serves 20–22</div>
      <div class="size-pill-price">$209.00</div>
    </div>
  </div>
</body>
</html>
